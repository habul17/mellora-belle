<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The MB monogram from the logo, gold on wine: the browser tab, Google's
         results (it wants a multiple of 48px), and phone home screens. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mellora Belle | Designer kurthis and co-ord sets</title>
    <meta name="description" content="Designer kurthis and co-ord sets in bold floral prints, shipped across India from Coimbatore. Easy 7-day returns, secure payment by UPI, card or netbanking." />
    <meta name="theme-color" content="#faf7f2" />
    <!-- What WhatsApp, Instagram and Facebook show when the shop's link is shared.
         These apps don't run the site's JavaScript, so this is the preview for every page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mellora Belle" />
    <meta property="og:title" content="Mellora Belle | Designer kurthis and co-ord sets" />
    <meta property="og:description" content="Bold floral prints, shipped across India. Easy 7-day returns." />
    <meta property="og:image" content="https://res.cloudinary.com/ozdnlp8w/image/upload/c_pad,b_rgb:f2ece3,w_1200,h_630,f_jpg,q_auto/v1787977479/IMG_6654.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tells Google the site's name and logo, for its results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "WebSite", "name": "Mellora Belle", "url": "https://www.mellorabelle.com/" },
          {
            "@type": "Organization",
            "name": "Mellora Belle",
            "url": "https://www.mellorabelle.com/",
            "logo": "https://www.mellorabelle.com/logo.jpg",
            "slogan": "Wear Your Confidence"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
